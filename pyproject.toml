[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "better-shutup"
version = "0.3.0"
description = "Coordinate AI agent sessions and scheduled shutdown on Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = [
    "nuitka>=4.3",
    "ordered-set>=4.1",
    "ziglang>=0.14",
    "zstandard>=0.23",
]

[project.urls]
Repository = "https://github.com/BaiZiDog/BetterShutup"

[project.gui-scripts]
better-shutup = "better_shutup.app:main"

[tool.setuptools.packages.find]
include = ["better_shutup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
